name: Keepalive

on:
  schedule:
    # 每 20 天跑一次，留足余量，避免 GitHub 延迟导致超过 60 天
    - cron: '0 0 */20 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update keepalive file
        run: |
          mkdir -p .github
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive $(date -u +%Y-%m-%d)" || exit 0
          git push
